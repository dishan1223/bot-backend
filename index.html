<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nimo Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --surface3: #21262d;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --accent: #58a6ff;
    --accent-dim: rgba(88,166,255,0.12);
    --accent-glow: rgba(88,166,255,0.25);
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --bot-bubble: #1c2128;
    --user-bubble: #1a3a5c;
    --user-bubble-border: rgba(88,166,255,0.3);
    --success: #3fb950;
    --danger: #f85149;
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    height: 100vh;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 0;
  }

  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .logo-icon {
    width: 30px; height: 30px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }

  .logo-name {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--text-primary);
  }

  .new-chat-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-dim);
    border: 1px solid rgba(88,166,255,0.2);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .new-chat-btn:hover { background: rgba(88,166,255,0.2); border-color: rgba(88,166,255,0.35); }

  .sidebar-section-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    padding: 14px 16px 6px;
  }

  .thread-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }
  .thread-list::-webkit-scrollbar { width: 4px; }
  .thread-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .thread-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-xs);
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
  }
  .thread-item:hover { background: var(--surface3); }
  .thread-item.active { background: var(--surface3); }
  .thread-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 2px; height: 60%;
    background: var(--accent);
    border-radius: 2px;
  }

  .thread-icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface3);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .thread-info { flex: 1; min-width: 0; }
  .thread-title {
    font-size: 12.5px;
    font-weight: 400;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .thread-item.active .thread-title { color: var(--text-primary); font-weight: 500; }
  .thread-preview {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .thread-time {
    font-size: 10px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    flex-shrink: 0;
  }

  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 500;
    color: white;
    flex-shrink: 0;
  }

  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 12.5px; font-weight: 500; color: var(--text-primary); }
  .user-status { font-size: 11px; color: var(--success); display: flex; align-items: center; gap: 4px; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); }

  /* ── Main Chat ── */
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-topbar {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }

  .topbar-avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    position: relative;
  }

  .online-dot {
    position: absolute;
    bottom: -1px; right: -1px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    border: 2px solid var(--surface);
  }

  .topbar-info { flex: 1; }
  .topbar-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .topbar-sub { font-size: 11.5px; color: var(--text-secondary); }

  .topbar-actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: var(--radius-xs);
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: background 0.12s, color 0.12s;
  }
  .icon-btn:hover { background: var(--surface3); color: var(--text-primary); }

  /* ── Messages ── */
  .messages-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }
  .messages-area::-webkit-scrollbar { width: 4px; }
  .messages-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .date-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 12px 0;
  }
  .date-divider::before, .date-divider::after {
    content: ''; flex: 1;
    height: 1px;
    background: var(--border);
  }
  .date-divider span {
    font-size: 10.5px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
  }

  .msg-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 75%;
    animation: msgIn 0.2s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot  { align-self: flex-start; }

  .msg-avatar {
    width: 26px; height: 26px;
    border-radius: 8px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    margin-bottom: 2px;
  }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.55;
    max-width: 100%;
    word-break: break-word;
    position: relative;
  }

  .msg-row.bot .msg-bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border2);
    border-bottom-left-radius: 4px;
    color: var(--text-primary);
  }

  .msg-row.user .msg-bubble {
    background: var(--user-bubble);
    border: 1px solid var(--user-bubble-border);
    border-bottom-right-radius: 4px;
    color: var(--text-primary);
  }

  .msg-time {
    font-size: 10px;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    margin-top: 3px;
    padding: 0 4px;
  }

  .msg-row.user .msg-time { text-align: right; }

  .msg-meta {
    display: flex;
    flex-direction: column;
  }

  .typing-indicator {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
    animation: msgIn 0.2s ease;
  }
  .typing-indicator.visible { display: flex; }
  .typing-dots {
    background: var(--bot-bubble);
    border: 1px solid var(--border2);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    padding: 12px 16px;
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .typing-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Input ── */
  .chat-input-wrap {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .input-box {
    background: var(--surface3);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-box:focus-within {
    border-color: rgba(88,166,255,0.4);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  #message {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    resize: none;
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    line-height: 1.5;
    max-height: 120px;
    min-height: 22px;
    overflow-y: auto;
  }
  #message::placeholder { color: var(--text-muted); }
  #message::-webkit-scrollbar { width: 3px; }
  #message::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  .input-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .send-btn {
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    background: var(--accent);
    border: none;
    color: #0d1117;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #79c0ff; }
  .send-btn:active { transform: scale(0.93); }
  .send-btn:disabled { background: var(--surface3); color: var(--text-muted); cursor: not-allowed; }

  .input-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    text-align: center;
  }
  .input-hint kbd {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    background: var(--surface3);
    border: 1px solid var(--border2);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--text-secondary);
  }

  /* ── Empty state ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
    padding: 40px;
    text-align: center;
  }
  .empty-icon { font-size: 36px; margin-bottom: 4px; }
  .empty-title { font-size: 15px; font-weight: 500; color: var(--text-secondary); }
  .empty-sub { font-size: 13px; max-width: 260px; line-height: 1.5; }

  .suggestion-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }

  .chip {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 12.5px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .chip:hover {
    background: var(--accent-dim);
    border-color: rgba(88,166,255,0.3);
    color: var(--accent);
  }

  /* ── Error toast ── */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #2d1b1b;
    border: 1px solid rgba(248,81,73,0.3);
    color: #f85149;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    transition: transform 0.25s ease;
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <span class="logo-name">Nimo</span>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      New conversation
    </button>
  </div>

  <div class="sidebar-section-label">Recent</div>
  <div class="thread-list" id="threadList"></div>

  <div class="sidebar-footer">
    <div class="user-avatar">U</div>
    <div class="user-info">
      <div class="user-name">You</div>
      <div class="user-status"><span class="status-dot"></span> Online</div>
    </div>
    <button class="icon-btn" title="Settings" onclick="showToast('Settings coming soon')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</div>

<!-- Main Chat -->
<div class="chat-main">
  <div class="chat-topbar">
    <div class="topbar-avatar">
      ✦
      <span class="online-dot"></span>
    </div>
    <div class="topbar-info">
      <div class="topbar-name">Nimo</div>
      <div class="topbar-sub" id="topbarSub">AI Assistant · bot ID ab123x</div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" title="Clear chat" onclick="clearChat()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </div>
  </div>

  <div class="messages-area" id="messagesArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">✦</div>
      <div class="empty-title">Start a conversation</div>
      <div class="empty-sub">Ask Nimo anything — it's connected and ready to help.</div>
      <div class="suggestion-chips">
        <div class="chip" onclick="useChip(this)">👋 Hello, introduce yourself</div>
        <div class="chip" onclick="useChip(this)">💡 What can you do?</div>
        <div class="chip" onclick="useChip(this)">🛠 Help me debug something</div>
        <div class="chip" onclick="useChip(this)">📄 Summarize a document</div>
      </div>
    </div>
  </div>

  <div class="chat-input-wrap">
    <div class="input-box">
      <textarea id="message" placeholder="Message Nimo…" rows="1"></textarea>
      <div class="input-actions">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
    <div class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const BOT_ID = "ab123x";
  const API = "http://localhost:3000/api/v1/chat";

  let threads = [];
  let activeThread = null;
  let isLoading = false;

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function todayLabel() {
    return new Date().toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }

  function createThread(firstMsg) {
    const id = Date.now();
    const thread = {
      id,
      title: firstMsg.length > 36 ? firstMsg.slice(0, 36) + '…' : firstMsg,
      preview: '',
      messages: [],
      created: now()
    };
    threads.unshift(thread);
    activeThread = thread;
    renderThreadList();
    return thread;
  }

  function renderThreadList() {
    const list = document.getElementById('threadList');
    list.innerHTML = '';
    threads.forEach(t => {
      const el = document.createElement('div');
      el.className = 'thread-item' + (t === activeThread ? ' active' : '');
      el.innerHTML = `
        <div class="thread-icon">💬</div>
        <div class="thread-info">
          <div class="thread-title">${escHtml(t.title)}</div>
          <div class="thread-preview">${escHtml(t.preview || 'No messages yet')}</div>
        </div>
        <div class="thread-time">${t.created}</div>
      `;
      el.onclick = () => switchThread(t);
      list.appendChild(el);
    });
  }

  function switchThread(t) {
    activeThread = t;
    renderThreadList();
    renderMessages();
  }

  function newChat() {
    activeThread = null;
    renderThreadList();
    document.getElementById('messagesArea').innerHTML = `
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">✦</div>
        <div class="empty-title">Start a conversation</div>
        <div class="empty-sub">Ask Nimo anything — it's connected and ready to help.</div>
        <div class="suggestion-chips">
          <div class="chip" onclick="useChip(this)">👋 Hello, introduce yourself</div>
          <div class="chip" onclick="useChip(this)">💡 What can you do?</div>
          <div class="chip" onclick="useChip(this)">🛠 Help me debug something</div>
          <div class="chip" onclick="useChip(this)">📄 Summarize a document</div>
        </div>
      </div>`;
  }

  function clearChat() {
    if (activeThread) {
      activeThread.messages = [];
      activeThread.preview = '';
      renderMessages();
      renderThreadList();
    }
  }

  function renderMessages() {
    const area = document.getElementById('messagesArea');
    if (!activeThread || activeThread.messages.length === 0) {
      area.innerHTML = `<div class="empty-state"><div class="empty-icon">✦</div><div class="empty-title">No messages yet</div><div class="empty-sub">Send a message to start the conversation.</div></div>`;
      return;
    }
    area.innerHTML = `<div class="date-divider"><span>${todayLabel()}</span></div>`;
    activeThread.messages.forEach(m => appendBubble(m.role, m.text, m.time, false));
    area.scrollTop = area.scrollHeight;
  }

  function appendBubble(role, text, time, animate = true) {
    const area = document.getElementById('messagesArea');
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();

    const wrap = document.createElement('div');
    wrap.className = `msg-row ${role}`;
    if (!animate) wrap.style.animation = 'none';

    const avatarHtml = role === 'bot'
      ? `<div class="msg-avatar">✦</div>` : '';

    wrap.innerHTML = `
      ${avatarHtml}
      <div class="msg-meta">
        <div class="msg-bubble">${escHtml(text)}</div>
        <div class="msg-time">${time}</div>
      </div>
    `;
    area.appendChild(wrap);
    area.scrollTop = area.scrollHeight;
  }

  function showTyping() {
    const area = document.getElementById('messagesArea');
    const indicator = document.createElement('div');
    indicator.className = 'typing-indicator visible';
    indicator.id = 'typingIndicator';
    indicator.innerHTML = `
      <div class="msg-avatar">✦</div>
      <div class="typing-dots">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    area.appendChild(indicator);
    area.scrollTop = area.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g,'<br>');
  }

  function useChip(el) {
    const text = el.textContent.replace(/^.{2}\s/, '');
    document.getElementById('message').value = text;
    document.getElementById('message').focus();
    autoResize();
  }

  function autoResize() {
    const ta = document.getElementById('message');
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  }

  document.getElementById('message').addEventListener('input', autoResize);

  document.getElementById('message').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  async function sendMessage() {
    if (isLoading) return;
    const ta = document.getElementById('message');
    const msg = ta.value.trim();
    if (!msg) return;

    ta.value = '';
    autoResize();
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;

    const t = now();

    if (!activeThread) {
      createThread(msg);
      document.getElementById('messagesArea').innerHTML = `<div class="date-divider"><span>${todayLabel()}</span></div>`;
    }

    activeThread.messages.push({ role: 'user', text: msg, time: t });
    activeThread.preview = msg;
    appendBubble('user', msg, t);
    renderThreadList();

    showTyping();

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ msg, botId: BOT_ID })
      });
      const data = await res.json();
      hideTyping();
      const reply = data.reply || data.error || 'No response received.';
      const rt = now();
      activeThread.messages.push({ role: 'bot', text: reply, time: rt });
      activeThread.preview = '✦ ' + (reply.length > 40 ? reply.slice(0, 40) + '…' : reply);
      appendBubble('bot', reply, rt);
      renderThreadList();
    } catch (err) {
      hideTyping();
      const errMsg = 'Could not reach the server. Is it running on localhost:3000?';
      const rt = now();
      activeThread.messages.push({ role: 'bot', text: errMsg, time: rt });
      appendBubble('bot', errMsg, rt);
      showToast('Connection failed — ' + err.message);
    } finally {
      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('message').focus();
    }
  }
</script>
</body>
</html>
