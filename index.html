<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nimo Chat Test</title>

  <style>
    body{
      background:#0f172a;
      color:white;
      font-family:Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .container{
      width:400px;
      background:#1e293b;
      padding:20px;
      border-radius:12px;
    }

    h1{
      text-align:center;
    }

    textarea{
      width:100%;
      height:120px;
      padding:10px;
      border:none;
      border-radius:8px;
      resize:none;
      margin-top:10px;
      background:#334155;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:none;
      border-radius:8px;
      background:#3b82f6;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#2563eb;
    }

    .response{
      margin-top:20px;
      background:#334155;
      padding:12px;
      border-radius:8px;
      min-height:60px;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Nimo Chat</h1>

    <textarea id="message" placeholder="Type your message..."></textarea>

    <button onclick="sendMessage()">Send</button>

    <div class="response" id="response">
      Response will appear here...
    </div>
  </div>

  <script>
    async function sendMessage() {
      const msg = document.getElementById("message").value;
      const responseBox = document.getElementById("response");

      responseBox.innerText = "Thinking...";

      try {
        const res = await fetch("http://localhost:3000/api/v1/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            msg: msg,
            botId: "ab123x"
          })
        });

        const data = await res.json();

        responseBox.innerText = data.reply || data.error;

      } catch (err) {
        responseBox.innerText = "Error: " + err.message;
      }
    }
  </script>

</body>
</html>
