<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nimo · Your AI Pet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --accent: #6366f1;
            --accent-soft: #eef2ff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --bot-bubble: #f1f5f9;
            --user-bubble: #6366f1;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 24px;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --accent: #818cf8;
            --accent-soft: #312e81;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --bot-bubble: #334155;
            --user-bubble: #818cf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* --- Setup Screen --- */
        #setup-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .setup-card {
            background: var(--surface);
            padding: 40px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(0,0,0,0.05);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pet-avatar {
            font-size: 64px;
            margin-bottom: 16px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent);
        }

        p.subtitle {
            font-size: 15px;
            color: var(--text-sub);
            margin-bottom: 32px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-sub);
            padding-left: 4px;
        }

        input, select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 2px solid var(--bot-bubble);
            background: var(--bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: transform 0.2s, background 0.2s;
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* --- Chat Screen --- */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 10;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .small-avatar {
            width: 40px;
            height: 40px;
            background: var(--accent-soft);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .bot-status {
            display: flex;
            flex-direction: column;
        }

        .bot-name {
            font-weight: 600;
            font-size: 16px;
        }

        .status-tag {
            font-size: 11px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        #messages::-webkit-scrollbar {
            width: 4px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--bot-bubble);
            border-radius: 10px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-msg {
            align-self: flex-start;
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
            color: var(--text-main);
        }

        .user-msg {
            align-self: flex-end;
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .typing {
            display: none;
            align-self: flex-start;
            padding: 12px 16px;
            background: var(--bot-bubble);
            border-radius: 18px;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-sub);
            border-radius: 50%;
            animation: dotWave 1.4s infinite linear;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotWave {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .input-area {
            padding: 16px 20px 32px;
            background: var(--bg);
        }

        .input-wrapper {
            background: var(--surface);
            border-radius: 24px;
            padding: 8px 8px 8px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.05);
        }

        #user-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 0;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            color: var(--text-main);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-btn:active {
            transform: scale(0.9);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .setup-card {
                padding: 32px 24px;
            }
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen">
        <div class="setup-card">
            <div class="pet-avatar">🤖</div>
            <h1>Meet Nimo</h1>
            <p class="subtitle">Your cute AI pet companion</p>
            
            <div class="input-group">
                <label for="username">Owner Name</label>
                <input type="text" id="username" placeholder="What should Nimo call you?" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="location">Location</label>
                <select id="location">
                    <option value="sirajganj">Sirajganj</option>
                    <option value="bogura">Bogura</option>
                    <option value="dhaka">Dhaka</option>
                    <option value="rajshahi">Rajshahi</option>
                </select>
            </div>

            <button class="start-btn" onclick="startChat()">Wake up Nimo</button>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen">
        <header>
            <div class="header-info">
                <div class="small-avatar">🤖</div>
                <div class="bot-status">
                    <span class="bot-name">Nimo</span>
                    <span class="status-tag"><span class="status-dot"></span> Online</span>
                </div>
            </div>
            <button onclick="resetApp()" style="background:none; border:none; color:var(--text-sub); cursor:pointer;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
            </button>
        </header>

        <div id="messages">
            <!-- Messages appear here -->
        </div>

        <div class="typing" id="typing-indicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Say hello to Nimo..." autocomplete="off">
                <button class="send-btn" onclick="handleSend()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "/api/v1/chat"; // Using relative path for versatility
        const BOT_ID = "nimo_web_v1";

        const COORDS = {
            sirajganj: { lat: "24.4577", lon: "89.7080" },
            bogura: { lat: "24.8481", lon: "89.3730" },
            dhaka: { lat: "23.8103", lon: "90.4125" },
            rajshahi: { lat: "24.3745", lon: "88.6042" }
        };

        let userData = {
            name: "",
            location: "",
            lat: "",
            lon: ""
        };

        // Check for saved data
        window.onload = () => {
            const saved = localStorage.getItem('nimo_user');
            if (saved) {
                userData = JSON.parse(saved);
                showChat();
                addMessage('bot', `Welcome back, ${userData.name}! How can I help you today? (Note: The server is rolling up, so my first response might take a moment)`);
            }
        };

        function startChat() {
            const nameInput = document.getElementById('username');
            const name = nameInput.value.trim();
            const loc = document.getElementById('location').value;

            if (!name) {
                alert("Please tell Nimo your name!");
                nameInput.focus();
                return;
            }

            userData = {
                name: name,
                location: loc,
                lat: COORDS[loc].lat,
                lon: COORDS[loc].lon
            };

            localStorage.setItem('nimo_user', JSON.stringify(userData));
            showChat();
            addMessage('bot', `Hello ${name}! I'm Nimo, your digital pet. I'm so happy to meet you! (Note: The server is rolling up, so my first response might take a moment)`);
        }

        function showChat() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
        }

        function resetApp() {
            if(confirm("Do you want to reset your profile?")) {
                localStorage.removeItem('nimo_user');
                location.reload();
            }
        }

        function addMessage(role, text) {
            const messagesDiv = document.getElementById('messages');
            const msgEl = document.createElement('div');
            msgEl.className = `message ${role}-msg`;
            msgEl.innerText = text;
            messagesDiv.appendChild(msgEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = "";
            addMessage('user', msg);
            
            const typing = document.getElementById('typing-indicator');
            typing.style.display = 'flex';
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        msg: msg,
                        botId: BOT_ID,
                        userName: userData.name,
                        lat: userData.lat,
                        lon: userData.lon
                    })
                });

                typing.style.display = 'none';

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("API Error:", response.status, errorText);
                    addMessage('bot', `I'm having some trouble (Status ${response.status}). Try again in a bit?`);
                    return;
                }

                const data = await response.json();

                if (data.reply) {
                    addMessage('bot', data.reply);
                } else {
                    addMessage('bot', "Oops, I'm feeling a bit dizzy. Can you try again?");
                }
            } catch (error) {
                console.error(error);
                typing.style.display = 'none';
                addMessage('bot', "I couldn't reach my brain... is the internet okay?");
            }
        }

        // Enter key support
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
